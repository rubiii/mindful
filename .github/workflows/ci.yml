name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop

      - name: Lint ERB templates using Herb
        run: bin/herb analyze app --non-interactive --no-log-file

      - name: Verify I18n translations
        run: bundle exec i18n-tasks health

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mindful
          POSTGRES_PASSWORD: mindful
          POSTGRES_DB: mindful_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://mindful:mindful@localhost:5432/mindful_test
        run: bin/rails db:test:prepare test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  system-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mindful
          POSTGRES_PASSWORD: mindful
          POSTGRES_DB: mindful_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://mindful:mindful@localhost:5432/mindful_test
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  deploy:
    name: Deploy to Hetzner
    if: github.ref == 'refs/heads/main'
    needs: [scan_ruby, scan_js, lint, test, system-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      # Database Configuration
      DATABASE_URL: postgresql://mindful:${{ secrets.POSTGRES_PASSWORD }}@mindful-postgres:5432/mindful_production
      CACHE_DATABASE_URL: postgresql://mindful:${{ secrets.POSTGRES_PASSWORD }}@mindful-postgres:5432/mindful_production_cache
      CABLE_DATABASE_URL: postgresql://mindful:${{ secrets.POSTGRES_PASSWORD }}@mindful-postgres:5432/mindful_production_cable

      # Object Storage
      HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
      HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
      HETZNER_BUCKET: ${{ secrets.HETZNER_BUCKET }}
      HETZNER_REGION: ${{ secrets.HETZNER_REGION }}
      HETZNER_ENDPOINT: ${{ secrets.HETZNER_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.8
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Disable Host Key Checking
        run: |
          mkdir -p ~/.ssh
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Test SSH Connection
        run: ssh -o BatchMode=yes -o ConnectTimeout=5 root@46.224.204.243 echo "SSH Connection Successful"

      - name: Install dependencies
        run: bundle install

      - name: Deploy
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: postgresql://mindful:${{ secrets.POSTGRES_PASSWORD }}@mindful-postgres:5432/mindful_production
          CACHE_DATABASE_URL: postgresql://mindful:${{ secrets.POSTGRES_PASSWORD }}@mindful-postgres:5432/mindful_production_cache
          CABLE_DATABASE_URL: postgresql://mindful:${{ secrets.POSTGRES_PASSWORD }}@mindful-postgres:5432/mindful_production_cable
          HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
          HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
          HETZNER_BUCKET: ${{ secrets.HETZNER_BUCKET }}
          HETZNER_REGION: ${{ secrets.HETZNER_REGION }}
          HETZNER_ENDPOINT: ${{ secrets.HETZNER_ENDPOINT }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: bin/kamal deploy
