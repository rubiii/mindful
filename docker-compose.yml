services:
  postgres:
    image: postgres:18.2-alpine
    container_name: mindful_postgres
    environment:
      POSTGRES_USER: mindful
      POSTGRES_PASSWORD: mindful
      POSTGRES_DB: mindful_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindful"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: