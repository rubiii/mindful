# Name of your application. Used to uniquely configure containers.
service: mindful

# Name of the container image (use your-user/app-name on external registries).
image: ghcr.io/rubiii/mindful

# Deploy to these servers.
servers:
  web:
    - 46.224.204.243
  job:
    hosts:
      - 46.224.204.243
    cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
proxy:
  ssl: true
  host: mindful-rails.org

# Where you keep your container images.
registry:
  server: ghcr.io
  username: rubiii
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL
    - HETZNER_ACCESS_KEY_ID
    - HETZNER_SECRET_ACCESS_KEY
    - HETZNER_BUCKET
    - HETZNER_ENDPOINT
    - HETZNER_REGION
  clear:
    # Good Job runs in async mode (jobs execute in the web server process)
    # This is configured in config/environments/production.rb
    # To run jobs in a separate worker process, change execution_mode to :external
    # and add a 'job' server configuration above

    # Good Job configuration (optional overrides)
    # GOOD_JOB_MAX_THREADS: 5
    # GOOD_JOB_POLL_INTERVAL: 30
    # GOOD_JOB_QUEUES: "*"

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    RAILS_LOG_LEVEL: info

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "mindful_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.8
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# === PostgreSQL Database Configuration ===
#
# Choose ONE of the following options:
#
# Option A: Kamal Managed PostgreSQL (Accessory)
# ------------------------------------------------
# Good for: Single-server setups, staging environments, small applications
# Pros: Simple setup, everything managed by Kamal
# Cons: No automatic backups, runs on same server, manual scaling
#
accessories:
  postgres:
    image: postgres:16-alpine
    host: 46.224.204.243
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: mindful
        POSTGRES_DB: mindful_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

# Then create the additional databases manually:
#   kamal accessory exec postgres -i --reuse "psql -U mindful -c 'CREATE DATABASE mindful_production_cache;'"
#   kamal accessory exec postgres -i --reuse "psql -U mindful -c 'CREATE DATABASE mindful_production_cable;'"
#
# Set these in .kamal/secrets:
#   POSTGRES_PASSWORD=$(openssl rand -base64 32)
#   DATABASE_URL=postgresql://mindful:${POSTGRES_PASSWORD}@mindful-postgres:5432/mindful_production
#   CACHE_DATABASE_URL=postgresql://mindful:${POSTGRES_PASSWORD}@mindful-postgres:5432/mindful_production_cache
#   CABLE_DATABASE_URL=postgresql://mindful:${POSTGRES_PASSWORD}@mindful-postgres:5432/mindful_production_cable
#
#
# Option B: External Managed Database (RECOMMENDED for Production)
# -----------------------------------------------------------------
# Good for: Production environments, high availability, automatic backups
# Providers: AWS RDS, DigitalOcean Managed Database, Railway, Neon, Supabase
# Pros: Automatic backups, high availability, easy scaling, monitoring
# Cons: Additional cost, external dependency
#
# 1. Create a PostgreSQL 18+ instance with your provider
# 2. Create four databases: mindful_production, mindful_production_cache, 
#    mindful_production_queue, mindful_production_cable
# 3. Set these environment variables in .kamal/secrets (uncomment in env.secret above):
#   DATABASE_URL=postgresql://user:password@host:5432/mindful_production
#   CACHE_DATABASE_URL=postgresql://user:password@host:5432/mindful_production_cache
#   QUEUE_DATABASE_URL=postgresql://user:password@host:5432/mindful_production_queue
#   CABLE_DATABASE_URL=postgresql://user:password@host:5432/mindful_production_cable
#
# Note: No accessories configuration needed when using external database.
#
# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: valkey/valkey:8
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data
